# pnpm reads build-script approvals from this file. These four packages ship
# prebuilt native binaries and need their install scripts approved so that
# `pnpm install` doesn't abort with ERR_PNPM_IGNORED_BUILDS (which would
# otherwise break the Docker build on Coolify).
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true

# Advisory overrides. Both packages are transitive dependencies of astro and
# unreachable in this app (nothing imports astro:assets, and there are no
# .md/.mdx/.yaml sources to parse), but astro 5 pins them below the patched
# versions and the 5.x branch gets no security backports.
#   js-yaml <4.3.1  - quadratic CPU consumption resolving !!omap
#   sharp   <0.35.0 - inherited libvips CVEs
# Drop both once astro is on 7.x, which resolves them without an override.
overrides:
  js-yaml: ^4.3.1
  sharp: ^0.35.3
